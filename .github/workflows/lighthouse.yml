name: Qualis Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm run preview -- --host 0.0.0.0 > preview.log 2>&1 &

      - name: Wait for application
        run: npx wait-on http://localhost:4173/Qualis/

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.x autorun
